name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (pure JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable (the bit is lost when a ZIP is unpacked on Windows)
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine unit tests
        run: ./gradlew :core-engine:test --no-daemon
      - name: DAO SQL sanity check (runs the shipped queries against SQLite)
        run: python3 scripts/check_dao_sql.py

  android:
    name: Android build + unit tests + lint
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable (the bit is lost when a ZIP is unpacked on Windows)
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK, run app unit tests, lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: neelaxmi-focus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports
            core-engine/build/reports

  release:
    name: Release APK (signed only if secrets are configured)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable (the bit is lost when a ZIP is unpacked on Windows)
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore (only when the secret exists)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: building an UNSIGNED release APK."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Validate the APK exists and report whether it is signed
        run: |
          ls -la app/build/outputs/apk/release/
          test -n "$(ls app/build/outputs/apk/release/*.apk)" 
          echo "signed=$SIGNED" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: neelaxmi-focus-release-apk-${{ env.SIGNED == 'true' && 'signed' || 'unsigned' }}
          path: app/build/outputs/apk/release/*.apk

  instrumented:
    name: Instrumented tests (emulator API 30)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - name: Ensure gradlew is executable (the bit is lost when a ZIP is unpacked on Windows)
        run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
